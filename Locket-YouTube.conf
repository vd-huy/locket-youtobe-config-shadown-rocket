#!name=Locket va YouTube - rieng
#!desc=Locket va YouTube; can trien khai script Locket va cap nhat URL
[Rule]
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

[Url Rewrite]
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200

[Script]
# Xu ly YouTube protobuf response. Khong can chay script response tren request.
youtube_response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?.*)?$,script-path=https://cdn.jsdelivr.net/gh/dinhduyvinh09/AppPre@3d913176f1a3051077fc091ea89e9087e3e4b40c/js/youtube.response.js,requires-body=true,binary-body-mode=1,max-size=-1,engine=jsc,timeout=30,argument="{"lyricLang":"vi","captionLang":"vi","blockUpload":true,"blockImmersive":true,"debug":false}"
locket_headers = type=http-request,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://vd-huy.github.io/locket-youtobe-config-shadown-rocket/scripts/locket-headers.js,timeout=10
locket_revenuecat = type=http-response,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/?]+(?:\?.*)?$),script-path=https://vd-huy.github.io/locket-youtobe-config-shadown-rocket/scripts/locket-revenuecat.js,requires-body=true,max-size=-1,timeout=10
locket_config = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://vd-huy.github.io/locket-youtobe-config-shadown-rocket/scripts/locket-config.js,requires-body=true,max-size=-1,timeout=10

[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
hostname = %APPEND%, api.revenuecat.com, firebaseremoteconfig.googleapis.com, *.googlevideo.com, -redirector*.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com
