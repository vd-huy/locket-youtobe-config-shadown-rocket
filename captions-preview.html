const tabs = document.getElementById('tabs');
const content = document.getElementById('content');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const toastEl = document.getElementById('toast');

const PHOTOS = [
  'linear-gradient(160deg,#a1c4fd,#c2e9fb)','linear-gradient(160deg,#fbc2eb,#a6c1ee)',
  'linear-gradient(160deg,#84fab0,#8fd3f4)','linear-gradient(160deg,#ffecd2,#fcb69f)',
  'linear-gradient(160deg,#a18cd1,#fbc2eb)','linear-gradient(160deg,#fddb92,#d1fdff)',
  'linear-gradient(160deg,#96e6a1,#d4fc79)','linear-gradient(160deg,#e0c3fc,#8ec5fc)'
];
let current = 0;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function iconHtml(icon){
  if (!icon) return '';
  if (/^https?:/i.test(icon)) return '<img src="' + esc(icon) + '" alt="" onerror="this.remove()">';
  if (icon.indexOf('sf:') === 0) {
    const parts = icon.slice(3).split('|');
    return '<span class="ico sf" style="background:' + esc(parts[1] || '#8E8E93') + '"></span>';
  }
  return '<span class="ico">' + icon + '</span>';
}

function buildTabs(){
  DATA.forEach(([name, items], i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.innerHTML = esc(name) + '<span class="n">' + items.length + '</span>';
    b.onclick = () => { current = i; render(); };
    tabs.appendChild(b);
  });
}

function render(){
  tabs.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === current));
  const q = searchEl.value.trim().toLowerCase();
  content.innerHTML = '';
  let shown = 0;
  const term = q;
  DATA.forEach(([name, items], si) => {
    if (!q && si !== current) return;
    const matched = q ? items.filter(it => it[0].toLowerCase().includes(term) || it[1].toLowerCase().includes(term)) : items;
    if (!matched.length) return;
    const h = document.createElement('h2');
    h.className = 'section-title show';
    h.textContent = name + ' (' + matched.length + ')';
    content.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    matched.forEach(([key, text, c1, c2, tc, icon]) => {
      const idx = Math.abs([...key].reduce((a, ch) => a * 31 + ch.charCodeAt(0) | 0, 7)) % PHOTOS.length;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.background = PHOTOS[idx];
      // Emoji icon: embed after the text (same as captions.js). SF/img icon: render after text.
      let display = text;
      let tail = '';
      if (icon) {
        if (/^https?:/i.test(icon) || icon.indexOf('sf:') === 0) tail = iconHtml(icon);
        else if (!text.includes(icon)) display = text + ' ' + icon;
      }
      tile.title = key + ' — ' + display;
      tile.innerHTML = '<div class="pill" style="background:linear-gradient(135deg,' + esc(c1) + ',' + esc(c2) + ');color:' + esc(tc) + '">' + esc(display) + tail + '</div>'
        + '<div class="meta">' + esc(key) + ' · ' + esc(c1) + ' → ' + esc(c2) + '</div>';
      tile.onclick = () => copy(display);
      grid.appendChild(tile);
      shown++;
    });
    content.appendChild(grid);
  });
  countEl.textContent = q ? shown + ' / ' + 281 + ' captions' : '';
  emptyEl.style.display = shown ? 'none' : 'block';
}

let toastTimer;
function copy(text){
  const done = () => { toastEl.textContent = 'Đã copy: ' + text; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); done(); }
}

searchEl.addEventListener('input', render);
buildTabs();
render();
</script>
